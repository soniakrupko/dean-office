spring.application.name=dean-office

# --- Microsoft SQL Server ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=dean_office;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=***

# Таблиці та дані створюються скриптом sql/setup.sql у SSMS, а не при старті застосунку
spring.sql.init.mode=never

# Яку реалізацію DAO використовувати: client (JdbcClient) або template (JdbcTemplate)
app.dao.type=template
